meta:
  description_allcash: 'Operator instruction 2026-09-24: new entries absorb idle cash so booked profit is redeployed at once. Backtest about neutral (-0.3 pts per fortnight on 1h). Paired with its plain twin as control.'
  name: momentum_top3_30m_allcash
  frozen: true
  declared_utc: '2026-09-23'
  paper_only: true
  requested_by: 'operator: add lower timeframe paper bots'
  description: Donchian 20/10 gate, 40-bar momentum rank, top 3, full deployment on 30m bars. The deployed
    rule with identical parameters IN BARS, so the same rule on a faster clock, not a re-fit.
  backtest_verdict: FAILS. Recorded before launch at DECISIONS.md#lowtf-paper-bots.
  backtest_holdout: median 14d -9.94%, P(>5%) 0.290, worst -38.1%, turnover 188.1x per 14d, fee+tick drag
    12.62% per 14d
  backtest_fit: median 14d -6.26%, P(>5%) 0.292, worst -38.0%
  evidence: gates/lowtf_paper_bots.py, results/lowtf_paper_bots.json
  why_it_runs: Operator instruction, as forward evidence. Never a candidate, never promoted, nobody's
    control.
  falsification: If after 14 live days its median-equivalent return is not above the backtest's holdout
    median, the backtest was right and the bot should be stopped.
contenders:
  n: 3
  momentum_bars: 40
  breadth_max: 0.40
  max_weight: 0.50
  sizing: proportional to absolute 40-bar momentum
  declared_ref: DECISIONS.md#lowtf-contenders-declaration
  sticky: true
  sticky_ref: DECISIONS.md#let-winners-run-outcome
  htf_confirm: true
  volume_confirm: 1.5
  confirm_ref: DECISIONS.md#breakout-quality-outcome
  absorb_idle: true
  absorb_ref: DECISIONS.md#idle-cash-new-entry-declaration
  skip_short_z: [[null, -3], [-3, -2.5], [-2.5, -2], [-2, -1.5], [-1.5, -1], [-1, 1], [1, 1.5]]
  skip_long_z: []
  skip_source: 'frozen from the 30m fit period, DECISIONS.md#lowtf-exhaustion-outcome'
strategy:
  interval: 30m
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 3
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: true
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically
    significant effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at
    a 1 percent step, p=0.004. Cutting the slice at the same time removes that cost. Step and slice move
    together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain
    is reproduced by a random-timing nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only comparison book, nobody's control.
short:
  enabled: false
  disabled_utc: '2026-09-26'
  disabled_by: 'operator: turn off shorts on the short-term books, keep the profit ladder'
  disabled_ref: DECISIONS.md#short-term-shorts-off-2026-09-26
  regime: breadth_below
  breadth_max: 0.40
  momentum_bars: 40
  own_slots: true
  slots: 3
  require_negative_momentum: true
  regime_bars: 180
  entry_bars: 20
  exit_bars: 10
  execution: MARKET both legs, open at MaxBid, close at MinAsk, 0.1% per side
  topped_up: false
  laddered: true
  added_utc: '2026-09-23'
  added_by: 'operator instruction: add shorting to the short-term books'
  rule: 'While fewer than 40% of the pool have positive 40-bar momentum, names in a 20-bar breakdown
    with negative momentum and no live long channel are shorted, weakest first, in their own slots;
    closed when the close exceeds the prior 10-bar high.'
  evidence_ref: DECISIONS.md#lowtf-breadth-shorts-declaration
