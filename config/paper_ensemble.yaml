signal:
  family: donchian_ensemble
  mechanism: Range expansion across nine horizons simultaneously; a coin's weight is
    the fraction of horizons currently in an open breakout, so exposure scales with
    agreement across timescales rather than switching on one threshold.
  failure_mode: A choppy market breaks the shortest channels repeatedly without
    following through, so conviction oscillates near a third and pays the round trip
    each time. Nine horizons also cannot all be in a trade unless the move is large,
    so a genuine but shallow trend is under-weighted.
  lookbacks_days: [5, 10, 20, 30, 60, 90, 150, 250, 360]
  entry: close above the maximum close over the lookback, evaluated on lagged windows
  exit: close below a ratcheting stop set to max(prior stop, channel midpoint)
  aggregation: equal weight across the nine sub-models
  direction: long_only
  bar_interval: 1d
sizing:
  vol_target_annual: 0.25
  vol_lookback_days: 90
  max_gross_exposure: 1.0
  leverage_cap_applies_to: gross_exposure
  cap_semantics_ref: DECISIONS.md#leverage-cap-semantics
