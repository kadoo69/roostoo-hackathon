decision_rule: >
  The arm deployed is the one with the highest worst-window total return across W1, W2 and the last 3 days; ties go
  to the shallower worst drawdown. Z3 is reported beside it so the cost or gain of loosening is on record. If every
  arm loses money in two or more windows, the operator is told before anything is deployed.
