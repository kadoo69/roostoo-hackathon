meta:
  name: momentum_top5_cushion
  frozen: true
  declared_utc: '2026-09-20'
  description: momentum_top5_4h with the per-coin cushion gate. Its control is momentum_top5_4h
    itself, which runs the identical rule at regime_gate always_on.
  evidence_ref: DECISIONS.md#scanner-declaration
  control_arm: momentum_top5_4h
  gate_rule: Blocks NEW entries into names whose cushion above the exit floor is below
    min_cushion_pct. Never gates a held name. Never touches exits.
  caution: UNTESTED. No backtest supports this gate; it runs forward to generate evidence.
    THRESHOLD CHANGED 2026-09-20T08:40Z from 2.0% to 1.0% on operator instruction,
    AFTER observing it block TRXUSDT at a cushion of 1.184%. That is one observation
    and the new threshold sits just below it, so this is parameter selection on live
    data, not a prior. The forward record is reset to zero here and the previous record
    archived, because a record accumulated under one threshold cannot be read as evidence
    for another. Read nothing before 28 complete days FROM THIS RESET.
strategy:
  interval: 4h
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 5
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: cushion
  min_cushion_pct: 1.0
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 900
  poll_seconds: 60
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  added_utc: '2026-09-22'
  added_by: operator request to book profits across the fleet
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: '3 percent step with a 15 percent slice. Tightening the step ALONE is the
    only statistically significant effect in the ladder grid and it is harmful - holdout
    P(>20%) falls 0.168 to 0.070 at a 1 percent step, p=0.004. Cutting the slice at the same
    time removes that cost: 3x15 books 52 percent more often than 5x40 with a right-tail delta
    of -0.008 at p=0.73. Step and slice move together or not at all.'
  honest_status: 'Not a validated improvement. The holdout return gain is p=0.14 and the
    drawdown gain is reproduced by a random-timing nonsense control, so it is exposure
    reduction rather than timing. Deployed on operator instruction as forward evidence.'
  confound_warning: 'This book is a gated arm against momentum_top5_4h testing the cushion. Adding booking
  means its forward number now carries TWO treatments and cannot attribute either.
  Its control momentum_top5_4h is deliberately left without booking.'
