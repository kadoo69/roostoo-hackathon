meta:
  name: momentum_top3_full
  frozen: true
  declared_utc: '2026-09-20'
  description: 'momentum_top3_4h with full deployment: the book spreads across whatever signalled
    instead of holding cash in unfilled slots.'
  control: momentum_top3_4h. Identical in every other respect, so the treatment is the sizing and
    nothing else.
  evidence_ref: DECISIONS.md#full-deployment-outcome
  purpose: Screen 2 ranks on (Final - Initial)/Initial and advances the top 20 per region, so idle
    cash is pure drag on the metric that decides qualification. momentum_top3_4h averages 0.72 gross
    because only 2 of its 3 slots typically fire.
  measured: 'Holdout 14-day return distribution, full vs fixed: median 3.12% vs 1.92%, P(>5%) 0.467
    vs 0.428, P(>10%) 0.321 vs 0.288, P(>20%) 0.168 vs 0.164, maximum drawdown -43.32% vs -43.23%.
    Improves the right tail on BOTH windows, which nothing else tested this session has done.'
  the_cost_stated_plainly: The FIT window drawdown deteriorates badly, -31.8% to -49.2%, while the
    holdout is flat. The honest reading is that this configuration CAN produce a ~50% drawdown and
    the holdout simply did not contain the path that produces one. Calmar is 0.3 of the Screen 3
    composite, so what this buys in Screen 2 it may give back in Screen 3. It is the right trade
    ONLY while qualification is the binding constraint.
  caution: Concentration and full deployment compound. This is the most aggressive book in the repo.
    It exists as a gated A/B arm against momentum_top3_4h, not as a replacement, and 28 days must
    pass before the forward comparison is readable.
strategy:
  interval: 4h
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 3
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 900
  poll_seconds: 60
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: '3 percent step with a 15 percent slice. Tightening the step alone is the
    only statistically significant effect in the ladder grid and it is harmful - holdout
    P(>20%) falls 0.168 to 0.070 at a 1 percent step, p=0.004. Cutting the slice at the same
    time removes that cost. Step and slice move together or not at all.'
  honest_status: 'Not a validated improvement. The holdout return gain is p=0.14 and the
    drawdown gain is reproduced by a random-timing nonsense control, so it is exposure
    reduction rather than timing.'
  control_status_lost: 'This book was the clean control for alpha_flow. The operator was shown that enabling
  booking here ends that comparison and instructed to proceed on 2026-09-22. From
  this timestamp the pair measures the cushion or sizing treatment ON TOP OF booking,
  not against a no-booking baseline, and no reading may be carried across the boundary.
  DECISIONS.md#booking-on-every-bot'
