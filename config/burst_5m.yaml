meta:
  name: burst_5m
  frozen: true
  declared_utc: '2026-09-26'
  paper_only: true
  requested_by: 'operator: a shorter-timeframe, higher-risk strategy judged on the live market, not on backtests'
  description: 'Momentum burst on 5m bars: long-only top-2 breakout momentum, volume confirmed, no stretch cap on chasing
    strength, idle cash redeployed into each new entry, a 6-bar minimum hold, the 3%/15% ladder, no target lock.'
  design_basis: 'live logs 2026-09-23..26 (DECISIONS.md#path-forensics-2026-09-25, #fleet-review-2026-09-26, #signal-quality-2026-09-26):
    profit came from a few runners entered while already moving hard (entries after a >4% hour: +24.7k at 89% win); shorts
    lost -6.2k; sub-hour holds on fast clocks lost to fees; the volume filter carries most of the signal.'
  backtest_verdict: NOT USED by operator decision; judged on live results only. For the record the closest backtested relative
    (15m contenders, 4h check off) is about -8% a fortnight (DECISIONS.md#lowtf-long-only-clocks-outcome).
  falsification: Stop it if after 14 live days (2026-10-10) it is below momentum_top3_15m over the same days, or if it hits
    the 25% drawdown kill switch.
  declaration_ref: DECISIONS.md#burst-books-declaration
contenders:
  min_hold_bars: 6
  n: 2
  momentum_bars: 40
  breadth_max: 0.4
  max_weight: 0.5
  sizing: proportional to absolute 40-bar momentum
  declared_ref: DECISIONS.md#burst-books-declaration
  sticky: true
  sticky_ref: DECISIONS.md#let-winners-run-outcome
  htf_confirm: false
  volume_confirm: 1.5
  confirm_ref: DECISIONS.md#breakout-quality-outcome
  skip_short_z:
  - - null
    - -3
  - - -3
    - -2.5
  - - -2.5
    - -2
  - - -2
    - -1.5
  - - -1.5
    - -1
  - - -1
    - 1
  skip_long_z: []
  skip_source: long stretch cap removed on purpose (burst book chases strength); short list irrelevant, shorts off
  absorb_idle: true
strategy:
  interval: 5m
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 2
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: true
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically significant
    effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at a 1 percent step, p=0.004. Cutting
    the slice at the same time removes that cost. Step and slice move together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain is reproduced by a random-timing
    nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only comparison book, nobody's control.
short:
  enabled: false
  regime: breadth_below
  breadth_max: 0.4
  momentum_bars: 40
  own_slots: true
  slots: 3
  require_negative_momentum: true
  regime_bars: 180
  entry_bars: 20
  exit_bars: 10
  note: long-only by design
target_lock:
  enabled: false
  note: no lock by design (operator wants the tail)
