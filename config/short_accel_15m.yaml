meta:
  name: short_accel_15m
  frozen: true
  declared_utc: '2026-09-26'
  paper_only: true
  requested_by: 'operator: a short-only bot on negative momentum with acceleration as trend confirmation'
  description: 'Short-only 15m breakdown momentum: 20-bar breakdown with negative 40-bar momentum, entries confirmed by the
    4h breakdown, 1.5x volume, a >2% fall over the prior hour and accelerating (not blow-off) downside; top 2 at 50%; exit
    above the prior 10-bar high; ladder covers 15% each 3% fall.'
  falsification: Stop it after 14 live days (2026-10-10) if its return is negative, or at once on the 25% drawdown kill switch.
  declaration_ref: DECISIONS.md#short-accel-declaration
contenders:
  n: 2
  momentum_bars: 40
  breadth_max: 0.4
  max_weight: 0.5
  sizing: proportional to absolute 40-bar momentum, capped 0.5 each
  declared_ref: DECISIONS.md#short-accel-declaration
  sticky: true
  sticky_ref: DECISIONS.md#let-winners-run-outcome
  htf_confirm: true
  volume_confirm: 1.5
  confirm_ref: DECISIONS.md#breakout-quality-outcome
  skip_short_z: []
  skip_long_z: []
  skip_source: no stretch skips on this book
  absorb_idle: true
  min_hold_bars: 4
  sides: short
  prior_return_bars: 4
  prior_return_min: 0.02
  accel_confirm:
    short_bars: 12
    mid_bars: 48
    min: 0.0
    max: 2.0
strategy:
  interval: 15m
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 2
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: true
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically significant
    effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at a 1 percent step, p=0.004. Cutting
    the slice at the same time removes that cost. Step and slice move together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain is reproduced by a random-timing
    nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only comparison book, nobody's control.
short:
  enabled: true
  regime: breadth_below
  breadth_max: 0.4
  momentum_bars: 40
  own_slots: true
  slots: 3
  require_negative_momentum: true
  regime_bars: 180
  entry_bars: 20
  exit_bars: 10
  execution: MARKET both legs, open at MaxBid, close at MinAsk, 0.1% per side
  topped_up: false
  laddered: true
  note: 'short-only book; entries come from the contenders rule with sides: short (switch always on); the regime fields feed
    only the engine log'
  declared_ref: DECISIONS.md#short-accel-declaration
target_lock:
  enabled: false
  note: no lock by design
