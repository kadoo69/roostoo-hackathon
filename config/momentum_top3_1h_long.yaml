meta:
  name: momentum_top3_1h_long
  frozen: true
  declared_utc: '2026-09-23'
  paper_only: true
  requested_by: 'operator: seek a lower-timeframe edge with higher return and smoother Sharpe, Sortino and Calmar'
  description: The current confirmed, sticky 1h contenders paper book with shorts disabled. Entry needs the
    4h channel on the same side and 1.5x prior median quote volume; weights, skims and all other mechanics match.
  backtest_verdict: Historical nomination for forward paper only; same years informed earlier strategy selection.
  backtest_fit: '2023-24 median 14d +1.23%, Sharpe 1.72, Sortino 3.12, Calmar 3.97'
  backtest_holdout: '2025-26 median 14d +2.83%, Sharpe 2.05, Sortino 4.34, Calmar 7.17'
  evidence: gates/lowtf_confirmed_long_only.py, results/lowtf_confirmed_long_only.json
  why_it_runs: Prospective isolated comparison against momentum_top3_1h; no automatic promotion.
  falsification: Compare filled paper returns, costs, drawdowns and signal agreement with the unchanged
    1h paper control over at least 14 complete days; stop if the long-only book does not improve net
    return and downside-adjusted metrics together.
contenders:
  n: 3
  momentum_bars: 40
  breadth_max: 0.40
  max_weight: 0.50
  sizing: proportional to absolute 40-bar momentum
  declared_ref: DECISIONS.md#lowtf-contenders-declaration
  sticky: true
  sticky_ref: DECISIONS.md#let-winners-run-outcome
  htf_confirm: true
  volume_confirm: 1.5
  confirm_ref: DECISIONS.md#breakout-quality-outcome
  skip_short_z: [[null, -3], [-3, -2.5], [-2.5, -2], [-2, -1.5], [-1.5, -1]]
  skip_long_z: [[-1.5, -1]]
  skip_source: 'frozen from the 1h fit period, DECISIONS.md#lowtf-exhaustion-outcome'
strategy:
  interval: 1h
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 3
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: false
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically
    significant effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at
    a 1 percent step, p=0.004. Cutting the slice at the same time removes that cost. Step and slice move
    together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain
    is reproduced by a random-timing nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only comparison book, nobody's control.
short:
  enabled: false
  regime: breadth_below
  breadth_max: 0.40
  momentum_bars: 40
  own_slots: true
  slots: 3
  require_negative_momentum: true
  regime_bars: 180
  entry_bars: 20
  exit_bars: 10
  execution: MARKET both legs, open at MaxBid, close at MinAsk, 0.1% per side
  topped_up: false
  laddered: true
  added_utc: '2026-09-23'
  added_by: 'operator instruction: add shorting to the short-term books'
  rule: 'While fewer than 40% of the pool have positive 40-bar momentum, names in a 20-bar breakdown
    with negative momentum and no live long channel are shorted, weakest first, in their own slots;
    closed when the close exceeds the prior 10-bar high.'
  evidence_ref: DECISIONS.md#lowtf-breadth-shorts-declaration
