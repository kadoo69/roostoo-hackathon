meta:
  name: competition_r4
  frozen: true
  declared_utc: '2026-10-05T07:30:00Z'
  paper_only: false
  venue: roostoo
  keyset: comp
  requested_by: 'operator 2026-10-05 ~12:20 IST: "realistically tell me, nothing stuck onto the past, we are missing alpha
    in the live market"; then "yes run the check and prep the switch"'
  rule_source: 'config/regime_ls_30m.yaml (paper forward since 2026-10-01) with the short side off: the R4 arm of #regime-competition-outcome'
  changes_from_source: short.enabled false (the regime only blocks new longs in DOWN); meta, risk, execution and the booking
    chase cap from config/competition_z25.yaml (the live account settings)
  description: 'LIVE, competition account (STAGED until the operator says go): the contenders rule on 30m bars, top 3 long
    breakouts sized by 40-bar momentum, at most 0.5 each, no 4h confirmation, no new longs while the market regime is DOWN,
    no shorts; 3%/15% booking ladder.'
  falsification: from the switch, revert to config/competition_z25.yaml if this book trails the old rule's paper twin ride_z25_zrank_5m
    by more than 2 points at the day-3 check (2026-10-07 17:30 IST) or any later daily check; trailing its own paper record
    regime_ls_30m by more than 2 points is an execution fault, investigated first
  declared_ref: DECISIONS.md#competition-r4-2026-10-05
contenders:
  n: 3
  momentum_bars: 40
  breadth_max: 0.4
  max_weight: 0.5
  sizing: proportional to absolute 40-bar momentum
  declared_ref: DECISIONS.md#lowtf-contenders-declaration
  sticky: true
  sticky_ref: DECISIONS.md#let-winners-run-outcome
  htf_confirm: false
  volume_confirm: 1.5
  confirm_ref: DECISIONS.md#breakout-quality-outcome
  skip_short_z: []
  skip_long_z: []
  skip_source: frozen from the 30m fit period, DECISIONS.md#lowtf-exhaustion-outcome
  regime_note: '4h confirmation off on both sides: the regime switch is the higher-timeframe filter; short stretch filter
    off (it blocked almost every short, #crash-shorts-outcome)'
strategy:
  interval: 30m
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 3
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
  exit_escalation: true
  exit_escalation_ref: DECISIONS.md#exit-escalation-2026-10-02
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-12-31T00:00:00+00:00'
  derisk_end_utc: '2026-12-31T12:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: false
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically significant
    effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at a 1 percent step, p=0.004. Cutting
    the slice at the same time removes that cost. Step and slice move together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain is reproduced by a random-timing
    nonsense control, so it is exposure reduction rather than timing.
  confound_warning: live book; its paper record is regime_ls_30m (same rule with shorts on)
  underfill_max_chase: 0.01
  underfill_max_chase_ref: DECISIONS.md#underfill-chase-cap-2026-10-05
short:
  enabled: false
  note: 'off: shorts cost 19.1 points over 08-01..10-03 (R1 vs R4, #regime-competition-outcome) and -119 USD forward since
    the open on regime_ls_30m'
target_lock:
  enabled: false
  disabled_utc: '2026-09-26'
  disabled_by: 'operator: the best books should be able to reach +20k; the lock caps them at +5% on the window anchor'
  disabled_ref: DECISIONS.md#short-term-lock-off-2026-09-26
  window_start_utc: '2026-09-24T00:00:00+00:00'
  window_end_utc: '2026-10-08T00:00:00+00:00'
  lock_return: 0.05
  keep_gross: 0.3
  declared_ref: DECISIONS.md#lowtf-lock-declaration
regime:
  index: equal-weight return of the tradable pool (the first market factor, corr 0.99 with PC1)
  window_bars: 8
  down_return: -0.01
  down_breadth: 0.25
  up_return: 0.01
  up_breadth: 0.75
  confirm_bars: 2
  rule: raw DOWN when the pool index fell at least 1% over the last 8 bars (4 h) and at most 25% of coins rose; raw UP when
    it rose at least 1% and at least 75% rose; else NEUTRAL. The state becomes DOWN after 2 consecutive raw DOWN bars and
    leaves DOWN after 2 consecutive bars that are not raw DOWN.
