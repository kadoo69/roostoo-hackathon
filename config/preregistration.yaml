meta:
  registered_utc: '2026-09-19'
  registered_before_any_gate_run: true
  amendment_policy: Thresholds are frozen. An amendment requires a new file with a new registered_utc and invalidates every prior gate artifact.
venue:
  name: roostoo_mock
  base_url: https://mock-api.roostoo.com
  initial_nav_usd: 100000
  max_leverage: 1.0
  shorting: true
  perpetuals: false
  funding_rate: false
  orderbook_depth_available: false
  shorting_endpoints:
  - /v6/short_open
  - /v6/short_close
  - /v6/short_positions
  short_fee_has_maker_discount: false
costs:
  source: organizer_verbal_2026_09_18
  spot_market_fee: 0.001
  spot_limit_fee: 0.0005
  short_fee_open: 0.001
  short_fee_close: 0.001
  short_fee_limit_discount: false
  spread_model: one_tick_from_price_precision
  impact_model: none
  impact_justification_ref: DECISIONS.md#impact
  requires_empirical_confirmation_by: '2026-10-01'
  confirmed: false
data:
  price_source: binance_spot
  price_source_justification_ref: DECISIONS.md#price-source
  quote_asset: USDT
  survivorship_free: true
  symbol_history_source: s3://data.binance.vision
  bar_interval: 1h
  label_horizon_bars: 24
  embargo_bars: 24
universe:
  definition: pit_top_n_by_dollar_volume
  max_spread_bps: 5.0
  min_history_bars: 2160
  exclude_asset_types:
  - stock
  exclude_justification_ref: DECISIONS.md#tokenized-stocks
  rebalance: daily
  top_n: 20
  top_n_grid:
  - 20
  size_lookback_days: 30
  diagnostic_variants:
  - live_top20_survivor_conditioned
  justification_ref: DECISIONS.md#top20-universe
trials:
  ledger: config/trials.yaml
  counts_nulls: true
  counts_abandoned_searches: true
gates:
  g1_data_integrity:
    applicable: true
    max_lookahead_violations: 0
    max_survivorship_violations: 0
    require_monotonic_timestamps: true
  g2_parameter_sensitivity:
    applicable: true
    perturbation_steps:
    - -2
    - -1
    - 1
    - 2
    min_neighbour_sharpe_ratio_to_peak: 0.5
    max_peak_isolation_score: 0.35
  g3_cpcv:
    applicable: true
    n_groups: 10
    n_test_groups: 2
    min_median_oos_sharpe: 0.5
    min_fraction_paths_positive: 0.65
  g4_deflated_sharpe:
    applicable: true
    min_dsr_probability: 0.95
  g5_pbo:
    applicable: true
    max_pbo: 0.5
  g6_walk_forward:
    applicable: true
    modes:
    - anchored
    - rolling
    min_oos_to_is_sharpe_ratio: 0.6
  g7_cost_adjusted:
    applicable: true
    min_net_sharpe: 0.5
    min_net_annual_return: 0.0
    max_annual_fee_spend_fraction_of_nav: 0.26
  g8_regime:
    applicable: true
    regimes:
    - bull
    - bear
    - range
    max_regime_drawdown: 0.25
    require_positive_in_n_regimes: 2
  g9_capacity:
    applicable: false
    not_applicable_reason_ref: DECISIONS.md#impact
  g10_shadow:
    applicable: true
    min_signal_correlation_live_vs_backtest: 0.95
    max_fill_price_deviation_bps: 5.0
    min_shadow_days: 3
competition:
  live_window_start: '2026-10-04'
  live_window_end: '2026-10-17'
  live_trading_days: 14
  min_active_days_required: 10
  live_result_is_evidence: false
  live_result_justification_ref: DECISIONS.md#sample-size
risk:
  max_gross_exposure: 1.0
  max_net_exposure: 0.8
  max_single_name_weight: 0.2
  drawdown_circuit_breaker: 0.12
  circuit_breaker_is_fitted: false
  kill_switch_conditions:
  - nav_drawdown_from_peak_exceeds_circuit_breaker
  - venue_error_rate_above_0.25_over_20_requests
  - position_reconciliation_mismatch
  - stale_ticker_older_than_120s
portfolio:
  no_trade_band: 0.25
  no_trade_band_is_fitted: false
  no_trade_band_grid:
  - 0.25
  justification_ref: DECISIONS.md#no-trade-band
  max_net_exposure: 0.8
objective:
  name: screen3_weighted
  definition: 0.4*sortino + 0.3*sharpe + 0.3*calmar
  weights:
    sortino: 0.4
    sharpe: 0.3
    calmar: 0.3
  source: roostoo_plan.md section 0
  calmar_cap: 5.0
  sortino_cap: 5.0
  sharpe_cap: 5.0
  cap_reason_ref: DECISIONS.md#screen3-caps
  screen2_gate: raw_return_rank_top20_per_region
  fitted_on: in_sample_only
  in_sample_end: '2023-01-01'
  judged_on: out_of_sample_14d_bootstrap
  benchmark: btc_buy_and_hold
overlay:
  vol_target_annual_grid:
  - 0.3
  - 0.5
  - 0.7
  vol_lookback_days: 30
  max_leverage_multiple: 1.0
  asymmetric_derisk_grid:
  - false
  - true
  drawdown_circuit_breaker: 0.12
  circuit_breaker_swept: false
  justification_ref: DECISIONS.md#overlay-grid
bootstrap:
  window_days: 14
  draws: 4000
  seed: 20260919
  block: contiguous
  reason_ref: DECISIONS.md#competition-bootstrap
horizon_search:
  declared_utc: '2026-09-19'
  bar_intervals:
  - 4h
  - 8h
  - 12h
  - 1d
  sma_pairs_in_bars:
  - - 6
    - 24
  - - 12
    - 48
  - - 20
    - 50
  signal: volume_confirmed_trend
  volume_lookback_bars: 10
  configs: 12
  selection_metric: bootstrap_14d_median_composite
  selection_constraint: 'must clear Screen 2 return gate: P(return>0) >= 0.50'
  fitted_on: in_sample_only
  judged_on: out_of_sample_14d_bootstrap
  min_flips_per_14d: 2
  justification_ref: DECISIONS.md#horizon-search
asymmetry:
  declared_utc: '2026-09-19'
  thesis_ref: DECISIONS.md#asymmetry-thesis
  atr_lookback_bars: 14
  stop_atr_multiple_grid:
  - 1.5
  - 2.5
  trailing_atr_multiple_grid:
  - 3.0
  daily_loss_breaker_grid:
  - 0.03
  daily_loss_breaker_swept: false
  vol_target_daily_grid:
  - 0.015
  - 0.025
  decision_bars_grid:
  - 4h
  - 8h
  cash_buffer: 0.25
  max_gross_exposure: 1.0
  configs: 8
family_comparison:
  declared_utc: '2026-09-19'
  purpose: compare mechanisms, not parameters; one fixed untuned setting per family
  families:
    sma_trend:
      mechanism: time-series trend continuation
      params:
        fast: 20
        slow: 50
    xsec_momentum:
      mechanism: cross-sectional relative strength
      params:
        lookback: 20
        quantile: 0.2
    donchian_breakout:
      mechanism: range expansion / new extreme
      params:
        lookback: 20
    short_reversal:
      mechanism: short-horizon overreaction correction
      params:
        lookback: 1
        quantile: 0.2
    volume_trend:
      mechanism: trend gated by volume expansion
      params:
        fast: 20
        slow: 50
        vol: 10
  bar_intervals:
  - 4h
  - 8h
  - 12h
  - 1d
  configs: 20
  parameters_tuned: false
  execution: LIMIT
  stops: false
  stops_reason_ref: DECISIONS.md#asymmetry-outcome
  judged_on:
  - screen3_oos
  - bootstrap_14d_screen2_tail
  - conditional_screen3_given_screen2
  screen2_return_threshold: 0.05
  threshold_reason_ref: DECISIONS.md#screen2-threshold
  benchmarks:
  - btc_hold
  - ew_top20_hold
