meta:
  name: momentum_top3_lock
  frozen: true
  declared_utc: '2026-09-23'
  paper_only: true
  description: 'momentum_top3_full plus the target lock: once the 14-day window is up 5%, hold at most
    0.3 gross for the rest of it.'
  control: momentum_top3_full, running the identical rule since the 2026-09-22T20:48Z reset; compare returns
    from window_start_utc.
  evidence: DECISIONS.md#competition-wf-outcome, results/competition_wf.json, results/lock_robustness.json
  what_it_buys: P(14-day return > 2%) 0.36->0.56 (2022), 0.57->0.69 (2023-24), 0.53->0.68 (2025-26); worst
    window unchanged.
  what_it_costs: P(> 15%) 0.08->0.00, 0.27->0.09, 0.22->0.06. It trades the chance of WINNING for the
    chance of QUALIFYING.
  forward_test: 'The window below is a rehearsal on the live feed, not the competition window. It tests
    the mechanics: anchoring, the lock firing, the forced de-risk, the cap on later entries, restart persistence.'
strategy:
  interval: 4h
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  ranking_rule: momentum
  n_positions: 3
  momentum_bars: 40
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
  regime_gate: always_on
  full_deployment: true
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 900
  poll_seconds: 60
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  added_utc: '2026-09-22'
  added_by: operator instruction to book profits on every bot, controls included
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically
    significant effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at
    a 1 percent step, p=0.004. Cutting the slice at the same time removes that cost. Step and slice move
    together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain
    is reproduced by a random-timing nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only lock rehearsal; its comparison is momentum_top3_full from window_start_utc.
target_lock:
  enabled: true
  window_start_utc: '2026-09-23T08:00:00+00:00'
  window_end_utc: '2026-10-07T08:00:00+00:00'
  lock_return: 0.05
  keep_gross: 0.3
  declared_ref: config/competition_wf.yaml arms.S4_target_lock
