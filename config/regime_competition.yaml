  declared_ref: DECISIONS.md#regime-competition-declaration
  written_before_any_number: true
  contamination: 'its forward paper result (+3.6% since its EC2 move, shorts in NEAR/PUMP profitable) was seen before declaring; that is the reason for the study and is not used to pass it'
