arms:
  R0: 'plain competition rule (config/competition.yaml contenders block, long-only)'
  R1: 'regime_ls_30m as configured (DOWN regime: block new longs, short breakdowns; 4h confirm off)'
  R2: 'R1 with the 4h confirmation on (isolates the regime switch from the filter change)'
  R3: 'R0 with the 4h confirmation off (= htf0, isolates the filter change)'
  R4: 'R1 without shorts (DOWN only blocks new longs)'
windows:
  pre: '2026-08-01 to 2026-09-19'
  live: '2026-09-19 to now'
  trend: '2026-09-17 to 09-23'
  chop: '2026-09-23 to now'
  rolling: 'every 14-day and 3-day window, stepped daily'
nonsense_control: '20 seeds: R1 with its DOWN regime series circularly shifted by a random 3-20 days; R1 must beat at least 16 of 20 on full-period total'
decision_rule: >
  R1 is recommended as the competition rule only if it beats R0 on total return in BOTH pre and live, its full-period max
  drawdown is no more than 2 pp worse, its worst 14-day window is no worse, it beats at least 16 of 20 shifted controls, and it
  holds under doubled fees. Comparison with the 50/50 split uses the split's stress-test numbers (#stress-split-vs-rule-2026-10-03).
  Shorts on the competition account additionally need the venue to allow them; otherwise only R4 is eligible.
trials: 'R1 to R4, one each'
