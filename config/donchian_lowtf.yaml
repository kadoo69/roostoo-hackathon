meta:
  declared_utc: '2026-09-19'
  declared_before_any_backtest: true
  requested_by: operator
  purpose: take the single-channel Donchian down the timeframe ladder for a 14-day
    competition window, without adding rules
  justification_ref: DECISIONS.md#donchian-lowtf-declaration
rule:
  entry: close above the highest close of the trailing entry window
  exit: close below a stop, held long-only, one position per name
  direction: long_only
  book: equal weight 1/20 across top-20 PIT liquid names, remainder cash
  stops_beyond_exit_rule: false
  filters: none
grid:
  intervals: [1h, 4h, 8h, 12h, 1d]
  lookback_modes:
    bars: entry window is a fixed number of BARS, so the signal speeds up as the
      interval shortens
    calendar: entry window is a fixed number of DAYS expressed in bars, so the signal
      is unchanged and only the execution grid gets finer
  entry_bars: 20
  entry_days: 20
  exit_modes: [midpoint, lowchannel]
  exit_lb_fraction: 0.5
  configs: 20
  all_counted_as_trials: true
mechanism: A channel breakout holds a position while price keeps making highs and
  releases it when the move stops extending. Shortening the bar does not change that
  logic; it changes how finely the exit can be placed and how many independent cycles
  fit inside fourteen days.
failure_mode: Cost scales inversely with horizon and this repo has measured that at
  every previous attempt. A channel system is stateful and therefore far lower
  turnover than a ranked book, but at some interval the fee on each entry and exit
  will exceed the average move the channel captures, and the calendar mode will
  degrade more slowly than the bars mode because its trade count barely changes.
evaluation:
  is_end: '2023-01-01'
  metrics: [sharpe, sortino, calmar, max_drawdown]
  competition: 14d_window_paired_vs_btc_hold
  screen1_check: fraction of days with at least one order
  benchmark: btc_buy_and_hold
