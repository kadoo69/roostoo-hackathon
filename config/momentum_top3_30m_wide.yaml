  frozen: true
  declared_utc: '2026-09-26'
  paper_only: true
  requested_by: 'operator: keep the highest-profit short-term momentum rule and let it run on the whole Roostoo pool to find
    and exploit edge cases'
  description: momentum_top3_30m exactly as it runs live (long-only, no lock, 4h check, volume check, ladder) on every tradable
    Roostoo crypto pair with Binance bars (about 64) instead of the top-30 Binance pool. momentum_top3_30m is its control.
  known_risk: 'live-window replay 2026-09-23..26 (DECISIONS.md#full-roostoo-pool-live-replay-2026-09-26): +12.35% on the whole
    pool against +12.79% on the top-30 pool, max drawdown -3.9% against -3.2%; thin names carry wider spreads the replay did
    not charge.'
  falsification: Stop it if after 14 live days (2026-10-10) it is below momentum_top3_30m over the same days, or on the 25%
    drawdown kill switch.
