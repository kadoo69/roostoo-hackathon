  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: 3 percent step with a 15 percent slice. Tightening the step alone is the only statistically
    significant effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at
    a 1 percent step, p=0.004. Cutting the slice at the same time removes that cost. Step and slice move
    together or not at all.
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain
    is reproduced by a random-timing nonsense control, so it is exposure reduction rather than timing.
  confound_warning: paper-only comparison book, nobody's control.
