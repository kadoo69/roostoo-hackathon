meta:
  name: donchian_5m
  frozen: true
  declared_utc: '2026-09-23'
  paper_only: true
  requested_by: 'operator: keep 5m/15m/30m/1h books to confirm a short-term trading bot for high trading volume and short-frame returns'
  description: The donchian_15m rule with identical parameters IN BARS on 5m bars, the same rule on a faster clock, not a re-fit.
  backtest_verdict: 'NOT BACKTESTED. The 5m cache holds five symbols, not a cross-section. Every slower clock of this rule failed by cost (DECISIONS.md#lowtf-paper-bots) and turnover roughly doubles each time the clock halves, so the prior is a loss.'
  why_it_runs: Operator instruction, as forward evidence. Never a candidate, never promoted, nobody's control.
  falsification: If after 14 live days its return is below its 15m sibling's over the same days, the faster clock only added cost and the bot should be stopped.
  declaration_ref: DECISIONS.md#lowtf-5m-paper-bots
strategy:
  interval: 5m
  entry_bars: 20
  exit_bars: 10
  top_n_pool: 30
  weight_divisor: 20
  max_gross: 1.0
  quote: USDT
  universe_refresh_hours: 24
  max_spread_bps: 5.0
  min_history_bars: 30
execution:
  order_type: LIMIT
  limit_offset_bps: 1.0
  limit_timeout_s: 300
  poll_seconds: 30
risk:
  max_drawdown: 0.25
  max_error_rate: 0.25
  max_ticker_age_s: 120
  mirror_max_deviation_bps: 50.0
  derisk_start_utc: '2026-10-15T00:00:00+00:00'
  derisk_end_utc: '2026-10-17T20:00:00+00:00'
booking:
  enabled: true
  step_pct: 0.03
  skim_fraction: 0.15
  recycle: false
  min_skim_notional: 10.0
  shorts: true
  added_utc: '2026-09-22'
  added_by: operator request to book profits across the fleet
  parameters_ref: DECISIONS.md#alpha-flow-declaration
  parameters_basis: '3 percent step with a 15 percent slice. Tightening the step ALONE is the only statistically
    significant effect in the ladder grid and it is harmful - holdout P(>20%) falls 0.168 to 0.070 at
    a 1 percent step, p=0.004. Cutting the slice at the same time removes that cost: 3x15 books 52 percent
    more often than 5x40 with a right-tail delta of -0.008 at p=0.73. Step and slice move together or
    not at all.'
  honest_status: Not a validated improvement. The holdout return gain is p=0.14 and the drawdown gain
    is reproduced by a random-timing nonsense control, so it is exposure reduction rather than timing.
    Deployed on operator instruction as forward evidence.
  confound_warning: paper-only comparison book, nobody's control.
short:
  enabled: true
  regime: breadth_below
  breadth_max: 0.40
  momentum_bars: 40
  own_slots: true
  slots: 20
  require_negative_momentum: true
  regime_bars: 180
  entry_bars: 20
  exit_bars: 10
  execution: MARKET both legs, open at MaxBid, close at MinAsk, 0.1% per side
  topped_up: false
  laddered: true
  added_utc: '2026-09-23'
  added_by: 'operator instruction: add shorting to the short-term books'
  rule: 'While fewer than 40% of the pool have positive 40-bar momentum, names in a 20-bar breakdown
    with negative momentum and no live long channel are shorted, weakest first, in their own slots;
    closed when the close exceeds the prior 10-bar high.'
  evidence_ref: DECISIONS.md#lowtf-breadth-shorts-declaration
