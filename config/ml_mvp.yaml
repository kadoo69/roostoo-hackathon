meta:
  name: ml_mvp
  declared_before_any_backtest: true
  declared_utc: '2026-09-23'
  requested_by: operator
  plan: ML_RESEARCH_PLAN.md
  declaration_ref: DECISIONS.md#ml-mvp-declaration
  hypothesis: 'A global Ridge model on seven price and flow features ranks liquid coins by their
    next-12h volatility-scaled return relative to the universe, and a top-5 long book built from
    that rank beats the simple momentum control after costs.'
  mechanism: 'Cross-sectional crypto returns carry short-horizon momentum at 1 to 7 days and
    reversal at the last bar, and the interaction with volatility and taker imbalance is roughly
    linear in ranks. A linear model on standardized ranks combines them with less overfitting than
    a hand-weighted rule.'
  failure_mode: 'The model relearns the 7-day momentum rank the momentum control already uses, so
    it adds turnover and cost without adding return; or the fitted weights flip sign between folds.'
  nonsense_control: 'The same portfolio driven by uniform random scores, 20 seeds. It must fail:
    median net Sharpe below the model and below zero after costs.'
  decision_rule: 'The model is useful only if, against the momentum control on the same dates,
    net Sharpe improves in at least three of five folds, the pooled net Sharpe gain is at least
    +0.20, strategy return is positive at 2x costs, max drawdown is no more than 5 points worse,
    and no single fold supplies more than half the pooled excess return. Otherwise it is a null
    and LightGBM is not run.'
data:
  decision_interval: 4h
  execution_interval: 1h
  execution_lag_hours: 1
  start: '2021-06-01'
universe:
  top_n: 30
  volume_lookback_days: 30
  min_history_days: 90
  exclude: [UUSDT, KGSTUSDT, XAUTUSDT, WBTCUSDT, USDSBUSDT]
  tokenized_stock_listed_from: '2026-06-01'
features:
  - ret_4h
  - ret_1d
  - ret_7d
  - vol_7d
  - dvol_chg
  - taker_imb_1d
  - btc_ret_1d
  - eth_ret_1d
  - breadth_1d
target:
  horizon_bars: 3
  kind: relative_vol_scaled
model:
  kind: ridge
  alphas: [1.0, 10.0, 100.0, 1000.0]
  purge_hours: 24
folds:
  first_fit_start: '2022-01-01'
  score_periods:
    - ['2024-07-01', '2025-01-01']
    - ['2025-01-01', '2025-07-01']
    - ['2025-07-01', '2026-01-01']
    - ['2026-01-01', '2026-07-01']
    - ['2026-07-01', '2026-10-01']
  validation_months: 6
  untouched_test: ['2026-10-01', '2027-04-01']
portfolio:
  rebalance_every_bars: 3
  long_n: 5
  short_n: 2
  target_annual_vol: 0.15
  vol_lookback_bars: 180
  max_gross: 1.0
  major_cap: 0.35
  alt_cap: 0.20
  alt_total_cap: 0.60
  majors: [BTCUSDT, ETHUSDT]
costs:
  long_fee: 0.001
  short_fee: 0.001
  slippage_bps: 2.0
  cost_multipliers: [1.0, 1.5, 2.0, 3.0]
controls:
  - btc_hold
  - btc_vol_scaled
  - equal_weight
  - momentum_7d
  - random
random_seeds: 20
arms:
  - ridge_long
  - ridge_long_short
