meta:
  name: momentum_top3_15m_eq
  frozen: true
  declared_utc: '2026-09-26'
  paper_only: true
  requested_by: 'operator: implement insight 3 (stop sizing by momentum strength) as a separate strategy and bot'
  description: momentum_top3_15m exactly as it runs live (long-only, no lock, ladder on) with equal weights across the chosen
    names instead of weights proportional to 40-bar momentum. momentum_top3_15m is its control.
  design_basis: 'DECISIONS.md#signal-quality-2026-09-26: among breakout candidates the cross-sectional IC of 40-bar momentum
    is negative at every clock and horizon (-0.03 to -0.10), so larger weights on the strongest names should not help; this
    conflicts with DECISIONS.md#lowtf-contenders-outcome (strength sizing beat random sizes), hence a live A/B rather than
    a switch.'
  falsification: Stop it if after 14 live days (2026-10-10) its return is below momentum_top3_15m over the same days.
  declaration_ref: DECISIONS.md#burst-strong-and-equal-weight-declaration
