meta:
  name: lowtf_long_only_clocks
  declared_before_any_backtest: true
  declared_utc: '2026-09-26'
  requested_by: 'operator: find the best-working strategies, diagnose them and make them better'
  declaration_ref: DECISIONS.md#lowtf-long-only-clocks-declaration
question: Does removing the short side improve the two best live short-term books (15m and 30m) under their exact live rules?
mechanism: 'Live, every profitable short-term book is a long trend-capture engine: shorts lost on 15m (-751), 5m (-1,180) and 1h (-4,425) while longs carried every book; history agrees (FINDINGS: short side has no edge at any clock, contenders both-sides lost to long-only, breadth shorts failed). Removing shorts removes a negative-expectancy leg and the turnover it adds.'
failure_mode: 'Shorts earn in falling markets (2022) and cushion drawdowns; removing them raises the worst 14-day window or loses the 2022 period.'
arms:
  L_live: exact live contenders rule per clock (sticky, frozen stretch skips from the live config, volume confirmation 1.5x, 4h alignment as live - ON at 30m and 1h, OFF at 15m), breadth-switched shorts, 3%/15% ladder both sides, 25% drift band, fee plus tick
  LO_long_only: identical, short switch always off
  NC_shifted_switch: nonsense control, identical to L_live with the breadth switch circularly shifted by half the sample, so shorts trade at the same rate at unrelated times
clocks: [15m, 30m, 1h]
reconciliation: the 1h L_live and LO arms must reproduce results/lowtf_confirmed_long_only.json (2025-26 median within 0.1 point) or nothing else is read
periods: competition_wf.PERIODS (2022, 2023-24, 2025-26), 14-day windows from 00:00 UTC on hourly-compounded net
pass_rule: 'Per clock, LO_long_only is adopted for forward paper if it beats L_live on median 14-day return AND P(>2%) in every period, its worst window is no more than 5 points below L_live in every period, and NC_shifted_switch reproduces less than half of LO gain in mean median across periods. Sharpe, Sortino, Calmar, P(>15%) reported, not gating.'
next_step: survivors run as new paper books beside their live twins; running books are never edited from a backtest
