meta:
  name: scalper_v1
  declared_utc: '2026-09-20'
  declared_before_any_backtest: true
  requested_by: operator
  operator_instruction: Build a scalper as a separate bot, make its rules robust, for testing
    only.
  mode: paper_only_never_promoted_automatically
  mechanism: 'Fade a move that was driven by AGGRESSIVE TAKER FLOW. Two independent sources point
    at the same conditioner: DECISIONS.md#flow-scalp-outcome found the divergence arm systematically
    beat its sign-flipped control with a coherent dose-response, every one of its top four configurations
    sitting at the strongest flow threshold tested, and 15m/30m beating 5m; arXiv:2608.21888 independently
    finds that short-horizon reversal ''concentrates after moves driven by aggressive taker flow
    and grows with flow intensity'' while order-book depth conditions nothing. The signal is therefore
    return conditioned on same-signed taker imbalance, faded.'
  what_is_new_here: 'DECISIONS.md#flow-scalp-outcome used a 1.5 ATR target against a 1.0 ATR stop
    and produced exactly the payoff that implies: the edge was carried by three trades and the
    MEDIAN trade lost money in three of four window/interval combinations. That is the opposite
    of what a scalper is for. This declaration inverts the payoff shape - a small target with
    a wider stop and a hard time stop - which is untested here, and adds a cost-aware gate from
    arXiv:2606.00060 that refuses any trade whose expected move does not clear a multiple of the
    round trip.'
  what_is_not_new: 'The entry family. Sub-hourly edge has been measured at 0.15 to 1.3 bps against
    a 10 bps round trip by DECISIONS.md#scalp-meanrev-outcome (0 of 54 positive), DECISIONS.md#flow-scalp-outcome
    (0 of 72 clearing the floor) and arXiv:2608.21888 across 183 pairs, which also reports that
    raising the threshold makes it worse. Position size cannot repair this: size scales edge and
    cost by the same factor. This is expected to fail and is declared so that it fails in a recorded,
    controlled way.'
  universe_constraint: Only BTC, ETH, SOL, XRP and DOGE have 5m history cached. Five names is
    not a cross-section, so nothing here generalises to the 30-name pool and no result may be
    read as if it did.
  kill_criterion: 'PRE-REGISTERED AND BINDING. The family is killed unless the MEDIAN per-trade
    net return over the holdout clears 0 bps and the MEAN clears the 10 bps round trip, on at
    least 200 trades, in at least one configuration. Sharpe is NOT the criterion: DECISIONS.md#scalp-meanrev-outcome
    established that net Sharpe at this horizon ranks configurations by turnover rather than by
    edge, with a fit/holdout rank correlation of +0.968 on Sharpe and -0.108 on per-trade edge.'
  failure_mode_to_watch: A small target with a wide stop manufactures a high win rate while losing
    money, which is the textbook way to make a scalper look good. Win rate is therefore NOT reported
    as a headline and the median trade is. Expect high win rate with negative expectancy.
  controls:
  - 'sign_flip: continuation instead of divergence, the same rule with the signal reversed'
  - 'random: entries at the same rate, ignoring flow entirely'
  - 'no_flow_gate: the same fade with the flow condition removed, to isolate what flow contributes'
  robustness_rules:
    cost_gate_multiple: expected move must exceed this multiple of the round trip or no trade
      is taken
    cooldown_bars: no re-entry in the same symbol for this many bars after an exit
    max_trades_per_day_per_symbol: turnover cap, so a configuration cannot win by trading more
    max_spread_bps: skip a name whose quoted spread exceeds this
    time_stop_bars: every position is closed by this age regardless of price
    max_gross: hard cap on gross exposure, applied to gross and never to a volatility scalar
grid:
  symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - XRPUSDT
  - DOGEUSDT
  intervals:
  - 15m
  - 30m
  lookback: 96
  ret_thresh:
  - 0.004
  - 0.008
  ofi_thresh:
  - 1.5
  - 2.0
  target_atr:
  - 0.35
  - 0.5
  stop_atr:
  - 1.0
  time_stop_bars:
  - 4
  - 8
  cost_gate_multiple:
  - 0.0
  - 2.0
  cooldown_bars: 2
  max_trades_per_day_per_symbol: 6
  max_spread_bps: 5.0
  max_gross: 1.0
  round_trip_bps: 10.0
method:
  fit_window:
  - '2023-01-01'
  - '2025-01-01'
  holdout_window:
  - '2025-01-01'
  - null
  judged_on: median and mean per-trade net return in bps, not Sharpe
  promotion: none. A pass earns a paper bot and 28 days of forward observation, nothing else.
