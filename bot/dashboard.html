<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roostoo Trading Desk</title>
<style>
:root{
 --bg:#090b0e; --panel:#11151a; --panel2:#0d1116; --line:#1e252e; --line2:#2a333e;
 --fg:#e8eef5; --dim:#7d8b9a; --faint:#586472;
 --up:#2ea043; --upbg:#0d2818; --dn:#e5484d; --dnbg:#2a1113;
 --warn:#d29922; --warnbg:#241c08; --acc:#4493f8;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:10;background:rgba(9,11,14,.92);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);padding:13px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:11px}
.brand h1{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--faint);letter-spacing:.04em}
.hstat{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hs{text-align:right}
.hs .l{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.hs .n{font-size:15px;margin-top:1px}
main{max-width:1560px;margin:0 auto;padding:20px 22px 60px;display:flex;flex-direction:column;gap:20px}
.sect{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.13em;margin-bottom:9px;font-weight:600}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.icard{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--line2);border-radius:6px;padding:12px 14px}
.icard.good{border-left-color:var(--up)} .icard.warn{border-left-color:var(--warn)}
.icard.bad{border-left-color:var(--dn)} .icard.neutral{border-left-color:var(--faint)}
.icard .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.icard .v{font-size:19px;margin:4px 0 5px;font-family:var(--mono)}
.icard.good .v{color:var(--up)} .icard.warn .v{color:var(--warn)} .icard.bad .v{color:var(--dn)}
.icard .d{font-size:11.5px;color:var(--faint);line-height:1.45}
.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:20px}
@media(max-width:1180px){.bots{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ph{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pt{font-size:13px;font-weight:600;letter-spacing:.04em}
.psub{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9.5px;padding:2.5px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tag.on{color:var(--up);border-color:#17351f;background:var(--upbg)}
.tag.off{color:var(--dn);border-color:#48191c;background:var(--dnbg)}
.tag.warn{color:var(--warn);border-color:#3d3110;background:var(--warnbg)}
.chart{padding:4px 0 0;background:var(--panel2);border-bottom:1px solid var(--line)}
svg.eq{width:100%;height:72px;display:block}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.m{background:var(--panel);padding:11px 14px}
.m .k{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}
.m .v{font-size:17px;margin-top:3px;font-family:var(--mono)}
.up{color:var(--up)} .dn{color:var(--dn)} .dim{color:var(--dim)} .faint{color:var(--faint)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media(max-width:700px){.split{grid-template-columns:1fr}.mg{grid-template-columns:repeat(2,1fr)}}
.sub{background:var(--panel)}
.sh{padding:10px 14px 7px;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:6px 14px;border-bottom:1px solid var(--line)}
td{padding:6px 14px;border-bottom:1px solid #161b21;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#151a20}
.r{text-align:right}
.bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--acc)}
.empty{padding:16px 14px;color:var(--faint);font-size:11.5px}
.breadth{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:11px 14px}
.chip{font-size:10.5px;font-family:var(--mono);padding:3px 7px;border-radius:3px;background:var(--dnbg);color:var(--dn);border:1px solid #48191c}
.note{font-size:11px;color:var(--faint);padding:0 2px}
</style></head><body>
<header>
 <div class="brand"><h1>Roostoo Trading Desk</h1><span id="mode">—</span></div>
 <div class="hstat" id="hstat"></div>
</header>
<main>
 <section><div class="sect">Market breadth · Donchian 20/10 on 4h</div><div id="breadth"></div></section>
 <section><div class="sect">Insights</div><div class="ins" id="ins"></div></section>
 <section><div class="sect">Bots</div><div class="bots" id="bots"></div></section>
 <div class="note" id="foot"></div>
</main>
<script>
const N=(v,d=2)=>v==null||Number.isNaN(v)?'—':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const S=v=>v==null?'dim':(v>0?'up':v<0?'dn':'dim');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function eqChart(s){
 if(!s||s.length<2)return '<div class="empty">collecting equity marks…</div>';
 const v=s.map(p=>p.e),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,W=100,H=72,pad=6;
 const X=i=>(i/(v.length-1))*W, Y=y=>H-pad-((y-mn)/r)*(H-pad*2);
 const line=v.map((y,i)=>`${X(i).toFixed(2)},${Y(y).toFixed(2)}`).join(' ');
 const area=`0,${H} `+line+` ${W},${H}`;
 const rising=v[v.length-1]>=v[0], col=rising?'var(--up)':'var(--dn)';
 const id='g'+Math.random().toString(36).slice(2,8);
 return `<div class="chart"><svg class="eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="${col}" stop-opacity=".22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <polygon points="${area}" fill="url(#${id})"/>
  <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
 </svg></div>`;
}
function breadthBlock(b,upd){
 if(!b)return '<div class="empty">scanning universe… first pass takes about a minute</div>';
 if(b.error)return `<div class="empty">breadth unavailable: ${esc(b.error)}</div>`;
 const pct=b.pct_long_all??0;
 const tone=pct>85?'warn':pct<20?'warn':'';
 const cells=[
  ['coins long',`${b.long_all}/${b.universe_size}`,`${N(pct,0)}% of venue`],
  ['pool long',`${b.long_pool}/${b.pool_size}`,'tradable set'],
  ['near entry',b.near_entry,'within 2% of trigger'],
  ['near exit',b.near_exit,'within 2% of stop'],
  ['median cushion',b.median_cushion_pct!=null?N(b.median_cushion_pct,1)+'%':'—','held above stop'],
 ].map(([k,v,d])=>`<div class="m"><div class="k">${k}</div><div class="v ${tone&&k==='coins long'?'dn':''}">${v}</div><div class="k faint" style="margin-top:3px;letter-spacing:.02em;text-transform:none">${d}</div></div>`).join('');
 const risk=(b.at_risk&&b.at_risk.length)?`<div class="sub"><div class="sh"><span>within 3% of stop</span></div><div class="chips">${b.at_risk.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`:'';
 return `<div class="breadth">${cells}</div>${risk}`;
}
function posTable(p){
 const e=Object.entries(p||{}); if(!e.length)return '<div class="empty">flat — no open positions</div>';
 const mx=Math.max(...e.map(x=>x[1]));
 return `<table><thead><tr><th>symbol</th><th class="r">weight</th></tr></thead><tbody>${
  e.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${N(v*100,2)}%<div class="bar"><i style="width:${(v/mx*100).toFixed(0)}%"></i></div></td></tr>`).join('')}</tbody></table>`;
}
function tradeTable(t){
 if(!t||!t.length)return '<div class="empty">no closed trades yet</div>';
 return `<table><thead><tr><th>symbol</th><th class="r">net ret</th><th class="r">p&l</th><th class="r">held</th></tr></thead><tbody>${
  t.slice(0,12).map(x=>`<tr><td>${esc(x.symbol)}</td><td class="r ${S(x.net_return_pct)}">${N(x.net_return_pct,2)}%</td><td class="r ${S(x.net_pnl)}">${N(x.net_pnl)}</td><td class="r faint">${N(x.hold_hours,1)}h</td></tr>`).join('')}</tbody></table>`;
}
function botPanel(b){
 const m=b.meta||{},s=b.blotter||{},p=b.performance;
 const tags=[b.live?'<span class="tag on">live</span>':'<span class="tag off">stale</span>',
  m.dry_run?'<span class="tag">paper</span>':'<span class="tag warn">live orders</span>',
  b.restarts>0?`<span class="tag warn">${b.restarts} restarts</span>`:'',
  b.halts>0?`<span class="tag off">${b.halts} halts</span>`:'',
  b.errors>0?`<span class="tag off">${b.errors} err</span>`:''].join('');
 const perf=p?[['sharpe',N(p.sharpe)],['sortino',N(p.sortino)],['calmar',N(p.calmar)],['screen 3',N(p.screen3)]]
   :[['sharpe','—'],['sortino','—'],['calmar','—'],['screen 3','—']];
 return `<div class="panel">
  <div class="ph"><div><div class="pt">${esc(b.bot)}</div><div class="psub">${esc(m.interval||'')} · ch ${m.entry}/${m.exit} · 1/${m.divisor}${m.rule?' · '+esc(m.rule)+' top '+m.n_positions:''} · ${esc(m.venue||'')}</div></div><div class="tags">${tags}</div></div>
  ${eqChart(b.equity_series)}
  <div class="mg">
   <div class="m"><div class="k">equity</div><div class="v">${N(b.equity,0)}</div></div>
   <div class="m"><div class="k">p&l</div><div class="v ${S(b.pnl)}">${N(b.pnl)}</div></div>
   <div class="m"><div class="k">return</div><div class="v ${S(b.pnl_pct)}">${N(b.pnl_pct,3)}%</div></div>
   <div class="m"><div class="k">drawdown</div><div class="v ${b.drawdown_pct<0?'dn':'dim'}">${N(b.drawdown_pct,2)}%</div></div>
   <div class="m"><div class="k">gross</div><div class="v">${N(b.gross*100,0)}%</div></div>
   <div class="m"><div class="k">positions</div><div class="v">${b.n_long}</div></div>
   <div class="m"><div class="k">closed</div><div class="v">${s.closed_trades??0}</div></div>
   <div class="m"><div class="k">realised</div><div class="v ${S(s.net_pnl)}">${N(s.net_pnl)}</div></div>
   ${perf.map(([k,v])=>`<div class="m"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
  </div>
  <div class="split">
   <div class="sub"><div class="sh"><span>open positions</span><span>${N(b.gross*100,0)}% gross</span></div>${posTable(b.positions)}</div>
   <div class="sub"><div class="sh"><span>closed trades</span><span>${s.win_rate!=null?N(s.win_rate*100,0)+'% win':''}</span></div>${tradeTable(b.closed)}</div>
  </div></div>`;
}
async function tick(){
 try{
  const d=await(await fetch('/api/state',{cache:'no-store'})).json();
  const A=d.bots[0]||{};
  document.getElementById('mode').textContent=(A.meta&&A.meta.dry_run?'paper trading · live prices':'LIVE ORDERS')+' · '+(A.meta?A.meta.venue:'');
  const tot=d.bots.reduce((a,b)=>a+(b.pnl||0),0), eq=d.bots.reduce((a,b)=>a+(b.equity||0),0);
  document.getElementById('hstat').innerHTML=[
   ['combined p&l',`<span class="${S(tot)}">${N(tot)}</span>`],['equity',N(eq,0)],
   ['bots live',d.bots.filter(b=>b.live).length+'/'+d.bots.length],
   ['cycles',d.bots.reduce((a,b)=>a+(b.cycles||0),0)]
  ].map(([l,n])=>`<div class="hs"><div class="l">${l}</div><div class="n num">${n}</div></div>`).join('');
  document.getElementById('breadth').innerHTML=breadthBlock(d.breadth,d.breadth_updated);
  const ins=[]; d.bots.forEach(b=>(b.insights||[]).forEach(i=>ins.push([b.bot,i])));
  const seen=new Set();
  document.getElementById('ins').innerHTML=ins.filter(([bot,i])=>{const k=bot+i.key;if(seen.has(k))return false;seen.add(k);return true})
   .map(([bot,i])=>`<div class="icard ${i.tone}"><div class="k">${esc(bot.replace('bot_',''))} · ${esc(i.key)}</div><div class="v">${esc(i.value)}</div><div class="d">${esc(i.detail)}</div></div>`).join('');
  document.getElementById('bots').innerHTML=d.bots.map(botPanel).join('');
  document.getElementById('foot').textContent='updated '+new Date(d.generated).toLocaleTimeString()+' · state refreshes every 5s · breadth every 4min'+(d.breadth_updated?' (last '+new Date(d.breadth_updated).toLocaleTimeString()+')':'');
 }catch(e){document.getElementById('foot').textContent='connection lost — is the dashboard process running?';}
}
tick();setInterval(tick,5000);
</script></body></html>
