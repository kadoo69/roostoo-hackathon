<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roostoo Bot Monitor</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a32;--fg:#e6edf3;--dim:#8b949e;--up:#3fb950;--dn:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--dim);font-size:12px}
.wrap{padding:16px;display:grid;gap:16px;max-width:1400px;margin:0 auto}
.bot{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.name{font-weight:600;letter-spacing:.04em}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.on{color:var(--up);border-color:#1d3d26;background:#0d2013}
.pill.off{color:var(--dn);border-color:#4a1f1f;background:#20100f}
.pill.warn{color:var(--warn);border-color:#4a3a11;background:#1d1708}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line)}
.cell{background:var(--panel);padding:11px 14px}
.k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.v{font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:8px 14px;border-bottom:1px solid var(--line)}
td{padding:7px 14px;border-bottom:1px solid #1a1f26;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.sec{padding:11px 14px 6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;border-top:1px solid var(--line)}
.right{text-align:right}
.spark{width:100%;height:44px;display:block}
.empty{padding:14px;color:var(--dim);font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Roostoo Bot Monitor</h1><span class="muted" id="ts">connecting…</span></header>
<div class="wrap" id="root"></div>
<script>
const n=(v,d=2)=>v==null?'—':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=v=>v==null?'dim':(v>0?'up':(v<0?'dn':'dim'));
function spark(s){
  if(!s||s.length<2)return '';
  const v=s.map(p=>p.e),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*100).toFixed(2)},${(38-((y-mn)/r)*34).toFixed(2)}`).join(' ');
  const col=v[v.length-1]>=v[0]?'var(--up)':'var(--dn)';
  return `<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1" points="${pts}"/></svg>`;
}
function posRows(p){
  const e=Object.entries(p||{});
  if(!e.length)return '<div class="empty">no open positions</div>';
  return `<table><tr><th>symbol</th><th class="right">weight</th></tr>${
    e.map(([k,v])=>`<tr><td>${k}</td><td class="right">${(v*100).toFixed(2)}%</td></tr>`).join('')}</table>`;
}
function tradeRows(t){
  if(!t||!t.length)return '<div class="empty">no closed trades yet</div>';
  return `<table><tr><th>symbol</th><th class="right">ret</th><th class="right">net</th><th class="right">hold h</th><th class="right">exit</th></tr>${
    t.map(x=>`<tr><td>${x.symbol}</td><td class="right ${sgn(x.net_return_pct)}">${n(x.net_return_pct,3)}%</td><td class="right ${sgn(x.net_pnl)}">${n(x.net_pnl)}</td><td class="right dim">${n(x.hold_hours,2)}</td><td class="right dim">${String(x.exit_ts).slice(11,19)}</td></tr>`).join('')}</table>`;
}
function bot(b){
  const s=b.blotter||{},p=b.performance;
  const health=b.live?'<span class="pill on">live</span>':'<span class="pill off">stale</span>';
  const halt=b.halts>0?'<span class="pill off">'+b.halts+' halts</span>':'';
  const err=b.errors>0?'<span class="pill off">'+b.errors+' errors</span>':'';
  const rs=b.restarts>0?'<span class="pill warn">'+b.restarts+' restarts</span>':'';
  const dry=b.meta&&b.meta.dry_run?'<span class="pill">paper</span>':'<span class="pill warn">LIVE ORDERS</span>';
  return `<div class="bot">
   <div class="bh"><div><span class="name">${b.bot}</span> <span class="muted">${b.meta.interval||''} · ${b.meta.entry||''}/${b.meta.exit||''} · ${b.meta.venue||''} · ${b.meta.sha||''}</span></div>
    <div>${health}${dry}${rs}${halt}${err}</div></div>
   ${spark(b.equity_series)}
   <div class="grid">
    <div class="cell"><div class="k">equity</div><div class="v">${n(b.equity)}</div></div>
    <div class="cell"><div class="k">p&l</div><div class="v ${sgn(b.pnl)}">${n(b.pnl)}</div></div>
    <div class="cell"><div class="k">return</div><div class="v ${sgn(b.pnl_pct)}">${n(b.pnl_pct,3)}%</div></div>
    <div class="cell"><div class="k">drawdown</div><div class="v ${b.drawdown_pct<0?'dn':'dim'}">${n(b.drawdown_pct,3)}%</div></div>
    <div class="cell"><div class="k">gross</div><div class="v">${n(b.gross*100,1)}%</div></div>
    <div class="cell"><div class="k">positions</div><div class="v">${b.n_long}</div></div>
    <div class="cell"><div class="k">cash</div><div class="v">${n(b.cash,0)}</div></div>
    <div class="cell"><div class="k">universe</div><div class="v">${b.n_universe}</div></div>
   </div>
   <div class="grid">
    <div class="cell"><div class="k">closed trades</div><div class="v">${s.closed_trades??0}</div></div>
    <div class="cell"><div class="k">win rate</div><div class="v">${s.win_rate!=null?n(s.win_rate*100,1)+'%':'—'}</div></div>
    <div class="cell"><div class="k">realised net</div><div class="v ${sgn(s.net_pnl)}">${n(s.net_pnl)}</div></div>
    <div class="cell"><div class="k">fees</div><div class="v dim">${n(s.total_fees)}</div></div>
    <div class="cell"><div class="k">profit factor</div><div class="v">${s.profit_factor??'—'}</div></div>
    <div class="cell"><div class="k">med hold</div><div class="v">${s.median_hold_hours!=null?n(s.median_hold_hours,1)+'h':'—'}</div></div>
    <div class="cell"><div class="k">cycles</div><div class="v">${b.cycles}</div></div>
    <div class="cell"><div class="k">uptime</div><div class="v">${n(b.wall_hours,1)}h</div></div>
   </div>
   ${p?`<div class="grid">
    <div class="cell"><div class="k">sharpe</div><div class="v">${n(p.sharpe)}</div></div>
    <div class="cell"><div class="k">sortino</div><div class="v">${n(p.sortino)}</div></div>
    <div class="cell"><div class="k">calmar</div><div class="v">${n(p.calmar)}</div></div>
    <div class="cell"><div class="k">screen 3</div><div class="v">${n(p.screen3)}</div></div>
   </div>`:'<div class="sec">screen 3 metrics need 3+ daily marks</div>'}
   <div class="cols">
    <div><div class="sec">open positions</div>${posRows(b.positions)}</div>
    <div><div class="sec">closed trades</div>${tradeRows(b.closed)}</div>
   </div>
  </div>`;
}
async function tick(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});const d=await r.json();
    document.getElementById('root').innerHTML=d.bots.map(bot).join('');
    document.getElementById('ts').textContent='updated '+new Date(d.generated).toLocaleTimeString()+' · auto-refresh 5s';
  }catch(e){document.getElementById('ts').textContent='connection lost — is the bot dashboard running?';}
}
tick();setInterval(tick,5000);
</script></body></html>
